# systemd drop-in for the Ollama service.
#   system service: /etc/systemd/system/ollama.service.d/20-local-agent.conf
#   user service:   ~/.config/systemd/user/ollama.service.d/20-local-agent.conf
# Then: systemctl daemon-reload && systemctl restart ollama
[Service]
# Server-wide default context. A model whose Modelfile sets PARAMETER num_ctx
# overrides this, and every model is silently clamped to its architectural max.
Environment="OLLAMA_CONTEXT_LENGTH=65536"

# Quantized KV cache halves its memory so a 64k window stays on a 16 GB GPU.
# At fp16, 65536 spilled to CPU (12%/88% CPU/GPU). Flash attention is required
# for the quantized KV cache to take effect.
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"

# Unload after 5 idle minutes so other GPU workloads can get the VRAM back.
Environment="OLLAMA_KEEP_ALIVE=5m"
